# AI Audit Platform Test Workflow
# Runs tests with coverage reporting

name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run linting
        run: |
          pip install ruff
          ruff check backend/
          ruff check tests/

      - name: Run type checking
        run: |
          pip install mypy
          mypy backend/app --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=backend.app --cov-report=xml --cov-report=html --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          cd backend
          python test_hard_gate.py
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Run API tests
        run: |
          pytest tests/test_api_routes.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

  docker-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ai-audit-platform:test .

      - name: Test Docker container
        run: |
          docker run -d --name test-container -p 8014:8014 ai-audit-platform:test
          sleep 10
          curl -f http://localhost:8014/api/v1/health || exit 1
          docker stop test-container

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install safety
        run: pip install safety

      - name: Check for vulnerabilities
        # Advisory: failures reported but not blocking (vulnerability DB may lag)
        continue-on-error: true
        run: |
          safety check -r requirements.txt

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust

      - name: Run performance tests
        # Advisory: perf tests may fail in CI due to resource constraints
        continue-on-error: true
        run: |
          cd backend
          python -m locust -f tests/performance/locustfile.py --headless -u 10 -r 2 --run-time 30s
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [integration-test, docker-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-audit-platform:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-audit-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # kubectl apply -f k8s/
          # or
          # docker-compose -f docker-compose.prod.yml up -d
