# AI Audit Platform Docker Compose Configuration
# Production-ready setup with monitoring and persistence

version: '3.8'

services:
  # Main application
  ai-audit-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-audit-platform
    ports:
      - "8014:8014"
    volumes:
      - audit-data:/app/data
      - ./frontend:/app/frontend:ro
    environment:
      - PYTHONPATH=/app/backend
      - DATABASE_URL=sqlite:///app/data/ai_audit_platform.db
      - LOG_LEVEL=INFO
      - WORKERS=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8014/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - ai-audit-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ai-audit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai-audit-platform
    restart: unless-stopped
    networks:
      - ai-audit-network

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-audit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - ai-audit-network

  # Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: ai-audit-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - ai-audit-network

  # Redis for caching (optional)
  redis:
    image: redis:alpine
    container_name: ai-audit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - ai-audit-network

volumes:
  audit-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  redis-data:
    driver: local

networks:
  ai-audit-network:
    driver: bridge
